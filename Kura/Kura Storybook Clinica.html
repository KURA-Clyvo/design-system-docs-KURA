<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Kura · Storybook — Sistema Clínica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Lexend:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kura-tokens.css"/>
<style>
/* ─── Shell ─────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  display: flex; flex-direction: column;
  -webkit-font-smoothing: antialiased;
}

/* ─── Top bar ──────────────────────────────────────────────── */
.sb-topbar {
  height: 52px; flex-shrink: 0;
  background: var(--bg-elev);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 16px; gap: 0;
}
.sb-logo {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--font-display); font-size: 20px; font-weight: 500;
  color: var(--text); text-decoration: none; flex-shrink: 0;
  padding-right: 16px; border-right: 1px solid var(--border);
}
.sb-logo em { font-style: italic; color: var(--ocean); }
.sb-logo .badge {
  font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--text-mute);
  background: var(--ocean-pale); color: var(--ocean);
  padding: 3px 8px; border-radius: 999px;
}
.sb-nav-tabs {
  display: flex; gap: 0; flex: 1; padding: 0 8px;
}
.sb-nav-tab {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--text-mute);
  padding: 0 14px; height: 52px; background: transparent; border: 0;
  border-bottom: 2px solid transparent; cursor: pointer;
  display: flex; align-items: center; gap: 6px;
  transition: color var(--d-fast), border-color var(--d-fast);
}
.sb-nav-tab:hover { color: var(--text); }
.sb-nav-tab.active { color: var(--ocean); border-bottom-color: var(--ocean); }
.sb-theme-toggle {
  margin-left: auto; display: flex; align-items: center; gap: 8px;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--text-mute);
}
.sb-theme-toggle button {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border-radius: 8px;
  background: var(--surface-2); border: 1px solid var(--border); cursor: pointer;
  color: var(--text-mute); transition: all var(--d-fast);
}
.sb-theme-toggle button:hover { color: var(--text); }
.sb-theme-toggle button.active { background: var(--ocean); color: var(--text-on-ocean); border-color: var(--ocean); }

/* ─── Body ─────────────────────────────────────────────────── */
.sb-body { flex: 1; display: flex; overflow: hidden; }

/* ─── Sidebar ──────────────────────────────────────────────── */
.sb-sidebar {
  width: 240px; flex-shrink: 0;
  background: var(--bg-elev); border-right: 1px solid var(--border);
  overflow-y: auto; padding: 16px 12px;
}
.sb-sidebar::-webkit-scrollbar { width: 4px; }
.sb-sidebar::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; }
.sb-group-label {
  font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--text-mute);
  padding: 8px 10px 4px; margin-top: 8px;
}
.sb-story-btn {
  width: 100%; text-align: left;
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; border-radius: 8px; border: 0;
  background: transparent; cursor: pointer; color: var(--text-soft);
  font-family: var(--font-body); font-size: 13px;
  transition: background var(--d-fast);
}
.sb-story-btn:hover { background: var(--surface-2); }
.sb-story-btn.active { background: var(--ocean-pale); color: var(--ocean); font-weight: 500; }
.sb-story-btn .dot {
  width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
  background: var(--border-strong);
}
.sb-story-btn.active .dot { background: var(--ocean); }

/* ─── Main canvas ──────────────────────────────────────────── */
.sb-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.sb-canvas-bar {
  height: 48px; flex-shrink: 0;
  background: var(--bg-elev); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px; padding: 0 20px;
  font-family: var(--font-mono); font-size: 11px; color: var(--text-mute); letter-spacing: 0.12em;
}
.sb-canvas-bar b { color: var(--text); font-weight: 600; }
.sb-canvas-bar .tag {
  background: var(--ocean-pale); color: var(--ocean);
  font-size: 9.5px; padding: 2px 8px; border-radius: 999px;
  letter-spacing: 0.14em; text-transform: uppercase;
}
.sb-canvas {
  flex: 1; overflow: auto; background: var(--surface-2);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 40px 40px 80px;
}
.sb-canvas-inner {
  background: var(--bg-elev); border: 1px solid var(--border);
  border-radius: 16px; box-shadow: var(--shadow-md);
  width: 100%; max-width: 960px; padding: 48px;
}

/* ─── Addons ───────────────────────────────────────────────── */
.sb-addons {
  height: 300px; flex-shrink: 0;
  border-top: 1px solid var(--border);
  background: var(--bg-elev);
  display: flex; flex-direction: column; overflow: hidden;
}
.sb-addons-tabs {
  display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.sb-addon-tab {
  font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--text-mute);
  padding: 0 18px; height: 40px; background: transparent; border: 0;
  border-bottom: 2px solid transparent; cursor: pointer;
  transition: color var(--d-fast), border-color var(--d-fast);
}
.sb-addon-tab.active { color: var(--ocean); border-bottom-color: var(--ocean); }
.sb-addons-body { flex: 1; overflow-y: auto; padding: 16px 20px; }

/* ─── Controls table ───────────────────────────────────────── */
.sb-controls-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.sb-controls-table th {
  text-align: left; font-family: var(--font-mono); font-size: 9.5px;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-mute);
  padding: 6px 10px 10px; border-bottom: 1px solid var(--border);
}
.sb-controls-table td {
  padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: middle;
}
.sb-controls-table tr:last-child td { border-bottom: 0; }
.ctrl-name  { font-family: var(--font-mono); font-size: 12px; color: var(--text); font-weight: 500; }
.ctrl-type  { font-family: var(--font-mono); font-size: 10.5px; color: var(--info); }
.ctrl-desc  { font-size: 12px; color: var(--text-mute); }
.ctrl-select {
  font-family: var(--font-body); font-size: 12.5px; padding: 5px 10px;
  background: var(--bg); border: 1px solid var(--border-strong);
  border-radius: 6px; color: var(--text); outline: none; cursor: pointer; min-width: 120px;
}
.ctrl-select:focus { border-color: var(--ocean); }
.ctrl-toggle {
  width: 36px; height: 20px; border-radius: 999px; border: 0;
  cursor: pointer; position: relative; transition: background var(--d-fast);
}
.ctrl-toggle.on  { background: var(--ocean); }
.ctrl-toggle.off { background: var(--border-strong); }
.ctrl-toggle::after {
  content: ''; position: absolute; top: 3px; width: 14px; height: 14px;
  border-radius: 50%; background: #fff; transition: left var(--d-fast);
}
.ctrl-toggle.on::after  { left: 19px; }
.ctrl-toggle.off::after { left: 3px; }
.ctrl-text {
  font-family: var(--font-body); font-size: 12.5px; padding: 5px 10px;
  background: var(--bg); border: 1px solid var(--border-strong);
  border-radius: 6px; color: var(--text); outline: none; min-width: 180px;
}
.ctrl-text:focus { border-color: var(--ocean); }

/* ─── Docs ─────────────────────────────────────────────────── */
.sb-docs { padding: 4px 0; }
.sb-docs h2 {
  font-family: var(--font-display); font-weight: 500; font-size: 28px;
  letter-spacing: -0.02em; color: var(--text); margin: 0 0 8px;
}
.sb-docs h2 em { font-style: italic; color: var(--ocean); font-weight: 400; }
.sb-docs .kicker {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--text-mute); margin-bottom: 6px;
}
.sb-docs p { font-size: 13px; line-height: 1.65; color: var(--text-soft); margin: 8px 0; }
.sb-docs code {
  font-family: var(--font-mono); font-size: 11.5px;
  background: var(--surface-2); padding: 2px 6px; border-radius: 4px; color: var(--info);
}
.sb-docs table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 16px; }
.sb-docs table th {
  text-align: left; font-family: var(--font-mono); font-size: 9.5px;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-mute);
  padding: 6px 10px; border-bottom: 1px solid var(--border);
}
.sb-docs table td {
  padding: 9px 10px; border-bottom: 1px solid var(--border);
  color: var(--text-soft); vertical-align: top;
}
.sb-docs .prop-required { color: var(--danger); font-size: 10px; font-family: var(--font-mono); font-weight: 600; }

/* ─── Story content styles ─────────────────────────────────── */
.story-section { margin-bottom: 44px; }
.story-section-label {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--text-mute);
  margin-bottom: 20px; display: flex; align-items: center; gap: 10px;
}
.story-section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.story-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 8px; }
.story-col { display: flex; flex-direction: column; gap: 10px; }
.preview-area {
  padding: 24px; background: var(--surface-2); border-radius: 12px;
  border: 1px dashed var(--border-strong); margin-bottom: 24px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 14px; min-height: 80px;
}

/* ─── Button — clinic (ocean primary) ─────────────────────── */
.kc-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-family: var(--font-body); font-size: 14px; font-weight: 500;
  padding: 10px 20px; min-height: 40px; border-radius: 8px;
  border: 1px solid transparent; cursor: pointer;
  transition: all var(--d-base) var(--ease); white-space: nowrap;
}
.kc-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(45,94,126,0.35); }
.kc-btn.sz-sm { font-size: 12px; padding: 6px 12px; min-height: 32px; border-radius: 6px; }
.kc-btn.sz-lg { font-size: 16px; padding: 13px 24px; min-height: 48px; border-radius: 10px; }
/* variants */
.kc-btn-primary   { background: var(--ocean); color: var(--text-on-ocean); }
.kc-btn-primary:hover:not(:disabled)   { background: var(--ocean-soft); }
.kc-btn-secondary { background: transparent; color: var(--ocean); border-color: var(--ocean); border-opacity: 0.5; }
.kc-btn-secondary:hover:not(:disabled) { background: var(--ocean-pale); }
.kc-btn-ghost     { background: var(--bg-elev); color: var(--text); border-color: var(--border-strong); }
.kc-btn-ghost:hover:not(:disabled)     { background: var(--surface-2); }
.kc-btn-danger    { background: var(--danger); color: #fff; }
.kc-btn-danger:hover:not(:disabled)    { opacity: 0.88; }
.kc-btn:disabled  { opacity: 0.45; cursor: not-allowed; }
@keyframes kspin { to { transform: rotate(360deg); } }
.kc-spinner {
  width: 15px; height: 15px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.30);
  border-top-color: currentColor; animation: kspin 0.7s linear infinite; flex-shrink: 0;
}
/* secondary/ghost spinner */
.kc-btn-secondary .kc-spinner,
.kc-btn-ghost .kc-spinner { border-color: rgba(0,0,0,0.15); border-top-color: currentColor; }

/* ─── TextField — clinic (ocean focus) ─────────────────────── */
.kc-tf-wrap { display: flex; flex-direction: column; }
.kc-tf-label {
  font-family: var(--font-mono); font-size: 10px; font-weight: 500;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-mute);
  margin-bottom: 6px; display: flex; align-items: center; gap: 4px;
}
.kc-tf-label .req { color: var(--danger); }
.kc-tf-input-wrap { position: relative; display: flex; align-items: center; }
.kc-tf-input {
  font-family: var(--font-body); font-size: 14px; width: 100%;
  padding: 10px 14px; background: var(--bg-elev);
  border: 1px solid var(--border-strong); border-radius: 8px;
  color: var(--text); outline: none;
  transition: border-color var(--d-fast), box-shadow var(--d-fast);
}
.kc-tf-input:focus {
  border-color: var(--ocean);
  box-shadow: 0 0 0 3px rgba(45,94,126,0.15);
}
.kc-tf-input::placeholder { color: var(--text-mute); }
.kc-tf-input.has-icon-l { padding-left: 38px; }
.kc-tf-input.has-icon-r { padding-right: 38px; }
.kc-tf-input.state-error   { border-color: var(--danger); }
.kc-tf-input.state-error:focus { box-shadow: 0 0 0 3px rgba(177,74,47,0.15); }
.kc-tf-input.state-success { border-color: var(--success); }
.kc-tf-input:disabled { opacity: 0.45; cursor: not-allowed; background: var(--surface-2); }
.kc-tf-icon-l, .kc-tf-icon-r {
  position: absolute; top: 50%; transform: translateY(-50%);
  color: var(--text-mute); pointer-events: none;
}
.kc-tf-icon-l { left: 12px; }
.kc-tf-icon-r { right: 12px; }
.kc-tf-footer { display: flex; justify-content: space-between; margin-top: 5px; min-height: 16px; }
.kc-tf-helper { font-size: 11.5px; color: var(--text-mute); }
.kc-tf-error  { font-size: 11.5px; color: var(--danger); font-weight: 500; }
.kc-tf-count  { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-mute); margin-left: auto; }

/* ─── SOAP demo ────────────────────────────────────────────── */
.kc-soap-demo {
  display: flex; flex-direction: column; gap: 14px;
}
.kc-soap-letter {
  width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
  background: var(--ocean); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 600; font-size: 15px;
}
.kc-soap-row { display: flex; gap: 12px; align-items: flex-start; }

/* ─── Inline code block ─────────────────────────────────────── */
.code-block {
  background: var(--bg-sunk); border: 1px solid var(--border);
  border-radius: 10px; padding: 16px 18px; margin: 16px 0;
  font-family: var(--font-mono); font-size: 12px; line-height: 1.65;
  color: var(--text-soft); overflow-x: auto;
}
.code-kw  { color: var(--ocean); font-weight: 600; }
.code-str { color: var(--sage); }
.code-cm  { color: var(--text-mute); font-style: italic; }
.code-typ { color: var(--amber); }
</style>
</head>
<body data-theme="light">
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
/* ── Icons ── */
function Icon({ d, size = 16, stroke = 1.8 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
         stroke="currentColor" strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round">
      <path d={d}/>
    </svg>
  );
}
const IC = {
  search:   'M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z',
  eye:      'M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8zm11 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',
  mail:     'M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zm0 0l8 9 8-9',
  plus:     'M12 5v14M5 12h14',
  arrow:    'M5 12h14M13 6l6 6-6 6',
  check:    'M5 12l5 5 9-11',
  alert:    'M12 4 2 20h20L12 4zM12 10v5M12 18v.5',
  rx:       'M6 4h6a4 4 0 0 1 0 8H6V4zM6 12l8 8M11 12l4-4',
  save:     'M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2zM17 21v-8H7v8M7 3v5h8',
  trash:    'M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6',
  sun:      'M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10z',
  moon:     'M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z',
  grid:     'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z',
  patients: 'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75',
};

/* ── KuraLogo ── */
function KuraLogo({ size = 24, color = 'var(--ocean)' }) {
  return (
    <svg width={size} height={size} viewBox="0 0 48 48" fill="none">
      <path d="M24 40C24 40 8 30 8 18C8 12 12 8 16 8C19 8 21.5 10 24 13C26.5 10 29 8 32 8C36 8 40 12 40 18C40 30 24 40 24 40Z"
        stroke={color} strokeWidth="2.5" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
      <circle cx="20" cy="20" r="2.5" fill={color} opacity="0.85"/>
      <circle cx="28" cy="20" r="2.5" fill={color} opacity="0.85"/>
      <circle cx="24" cy="26" r="3" fill={color}/>
    </svg>
  );
}

/* ── Button — clinic ── */
function KCButton({ variant = 'primary', size = 'md', loading = false, disabled = false, label = 'Botão', iconLeft = false, iconRight = false }) {
  const szCls = size === 'sm' ? 'sz-sm' : size === 'lg' ? 'sz-lg' : '';
  return (
    <button
      className={`kc-btn kc-btn-${variant} ${szCls}`}
      disabled={disabled || loading}
      aria-disabled={disabled || loading}
      aria-busy={loading}
    >
      {loading ? (
        <>
          <span className="kc-spinner" aria-hidden="true"/>
          <span style={{ opacity: 0.65 }}>{label}</span>
          <span className="sr-only">Carregando…</span>
        </>
      ) : (
        <>
          {iconLeft  && <Icon d={IC.patients} size={size === 'sm' ? 13 : 15}/>}
          {label}
          {iconRight && <Icon d={IC.arrow} size={size === 'sm' ? 13 : 15}/>}
        </>
      )}
    </button>
  );
}

/* ── TextField — clinic ── */
function KCTextField({ label = 'Label', placeholder = '', helperText = '', errorText = '', success = false, disabled = false, required = false, iconLeft = false, iconRight = false, showCharCount = false, maxLength = 80 }) {
  const [val, setVal] = React.useState('');
  const hasError = Boolean(errorText);
  const id = React.useId();
  return (
    <div className="kc-tf-wrap">
      <label htmlFor={id} className="kc-tf-label">
        {label}
        {required && <span className="req" aria-hidden="true">*</span>}
      </label>
      <div className="kc-tf-input-wrap">
        {iconLeft  && <span className="kc-tf-icon-l" aria-hidden="true"><Icon d={IC.search} size={14}/></span>}
        <input
          id={id}
          className={`kc-tf-input${iconLeft ? ' has-icon-l' : ''}${iconRight ? ' has-icon-r' : ''}${hasError ? ' state-error' : success ? ' state-success' : ''}`}
          placeholder={placeholder}
          disabled={disabled}
          required={required}
          aria-invalid={hasError}
          aria-required={required}
          maxLength={maxLength}
          value={val}
          onChange={e => setVal(e.target.value)}
        />
        {iconRight && <span className="kc-tf-icon-r" aria-hidden="true"><Icon d={IC.eye} size={14}/></span>}
      </div>
      <div className="kc-tf-footer">
        {hasError
          ? <span className="kc-tf-error" role="alert">{errorText}</span>
          : helperText
            ? <span className="kc-tf-helper">{helperText}</span>
            : <span/>
        }
        {showCharCount && <span role="status" className="kc-tf-count">{val.length}/{maxLength}</span>}
      </div>
    </div>
  );
}

/* ─── Stories ───────────────────────────────────────────────── */
const STORIES = {
  Button: {
    group: 'Componentes',
    autodoc: {
      title: 'Button',
      context: 'clinic',
      when: 'Use o Button do contexto `clinic` (ocean azul-marinho) em toda interface do sistema Kura Clínica: confirmar consultas, salvar prontuários, assinar receitas, iniciar teleorientação. A variante `primary` reservada para a ação principal da tela; `ghost` para ações de suporte; `danger` para exclusões irreversíveis (prontuários, receitas). No desktop, altura mínima de 36px para ações de toolbar, 40px para ações em card, 48px para ações de page-level.',
      props: [
        { name: 'variant',   type: "'primary'|'secondary'|'ghost'|'danger'", default: "'primary'",  desc: 'Estilo visual e intenção semântica.' },
        { name: 'size',      type: "'sm'|'md'|'lg'",                         default: "'md'",       desc: 'sm=32px, md=40px, lg=48px.' },
        { name: 'loading',   type: 'boolean',                                 default: 'false',      desc: 'Spinner + aria-busy. Bloqueia interação.' },
        { name: 'disabled',  type: 'boolean',                                 default: 'false',      desc: 'aria-disabled. Não use HTML disabled em links.' },
        { name: 'iconLeft',  type: 'boolean',                                 default: 'false',      desc: 'Slot ícone esquerdo (aria-hidden).' },
        { name: 'iconRight', type: 'boolean',                                 default: 'false',      desc: 'Slot ícone direito (aria-hidden).' },
        { name: 'label',     type: 'string',                                  default: "'Botão'",    desc: 'Texto do botão.' },
      ],
    },
    controls: {
      variant:   { type: 'select', options: ['primary','secondary','ghost','danger'], value: 'primary' },
      size:      { type: 'select', options: ['sm','md','lg'],                         value: 'md' },
      label:     { type: 'text',                                                       value: 'Iniciar consulta' },
      loading:   { type: 'toggle',                                                     value: false },
      disabled:  { type: 'toggle',                                                     value: false },
      iconLeft:  { type: 'toggle',                                                     value: false },
      iconRight: { type: 'toggle',                                                     value: false },
    },
    stories: [
      {
        name: 'Variantes', id: 'variants',
        render: (args) => (
          <div className="story-section">
            <div className="story-section-label">Variantes · contexto clinic</div>
            <div className="story-row">
              {['primary','secondary','ghost','danger'].map(v => {
                const labels = { primary: 'Iniciar consulta', secondary: 'Salvar rascunho', ghost: 'Cancelar', danger: 'Excluir prontuário' };
                return <KCButton key={v} {...args} variant={v} label={labels[v]}/>;
              })}
            </div>
          </div>
        ),
      },
      {
        name: 'Tamanhos', id: 'sizes',
        render: (args) => (
          <div className="story-section">
            <div className="story-section-label">Tamanhos · toolbar → card → page</div>
            <div className="story-row" style={{ alignItems: 'flex-end' }}>
              <KCButton {...args} size="sm" label="Toolbar"/>
              <KCButton {...args} size="md" label="Card action"/>
              <KCButton {...args} size="lg" label="Page action"/>
            </div>
          </div>
        ),
      },
      {
        name: 'Com ícones', id: 'icons',
        render: (args) => (
          <div className="story-section">
            <div className="story-section-label">Com ícones · slots esq/dir</div>
            <div className="story-row">
              <KCButton {...args} iconLeft={true}  label="Nova consulta"/>
              <KCButton {...args} iconRight={true} label="Finalizar →"/>
              <KCButton {...args} variant="ghost"  iconLeft={true}  label="Pacientes"/>
              <KCButton {...args} variant="danger" iconLeft={true}  label="Excluir"/>
            </div>
          </div>
        ),
      },
      {
        name: 'Estados', id: 'states',
        render: (args) => (
          <div className="story-section">
            <div className="story-section-label">Estados completos</div>
            <div className="story-row">
              <KCButton {...args} label="Normal"/>
              <KCButton {...args} label="Salvando…" loading={true}/>
              <KCButton {...args} label="Desabilitado" disabled={true}/>
            </div>
            <div className="story-row" style={{ marginTop: 10 }}>
              <KCButton {...args} variant="secondary" label="Salvar rascunho"/>
              <KCButton {...args} variant="secondary" label="Enviando…" loading={true}/>
              <KCButton {...args} variant="secondary" label="Sem permissão" disabled={true}/>
            </div>
          </div>
        ),
      },
      {
        name: 'Toolbar da consulta', id: 'toolbar',
        render: (args) => (
          <div className="story-section">
            <div className="story-section-label">Caso de uso · toolbar da consulta SOAP</div>
            <div style={{
              padding: '14px 18px', background: 'var(--bg-elev)',
              border: '1px solid var(--border)', borderRadius: 12,
              display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 10,
            }}>
              <div style={{ fontFamily: 'var(--font-mono)', fontSize: 11, color: 'var(--text-mute)', letterSpacing: '0.12em' }}>
                CONSULTA · LUNA · EM ANDAMENTO · 14:32
              </div>
              <div style={{ display: 'flex', gap: 8 }}>
                <KCButton variant="ghost"   size="sm" iconLeft={true}  label="Ditado"/>
                <KCButton variant="ghost"   size="sm" label="Salvar rascunho"/>
                <KCButton variant="primary" size="sm" iconRight={true} label="Finalizar"/>
              </div>
            </div>
          </div>
        ),
      },
      {
        name: 'Playground', id: 'playground',
        render: (args) => (
          <div className="story-section">
            <div className="story-section-label">Playground · controles abaixo</div>
            <div className="preview-area">
              <KCButton {...args}/>
            </div>
          </div>
        ),
      },
    ],
  },

  TextField: {
    group: 'Componentes',
    autodoc: {
      title: 'TextField',
      context: 'clinic',
      when: 'Use o TextField do contexto `clinic` em formulários de prontuário SOAP, busca de pacientes, cadastro de receituário, login da equipe. O foco usa o token `--ocean` (azul-marinho). Sempre forneça `label` explícito — nunca dependa somente de `placeholder`. Use `errorText` + `aria-invalid` para validação inline e `helperText` para contexto adicional. O slot `leadingSlot` é indicado para ícones de busca/email; o `trailingSlot` para visibility-toggle em campos de senha.',
      props: [
        { name: 'label',         type: 'string',   default: '—',      desc: 'Label sempre visível. Obrigatório.',        required: true },
        { name: 'placeholder',   type: 'string',   default: '—',      desc: 'Dica interna. Nunca substitui o label.' },
        { name: 'helperText',    type: 'string',   default: '—',      desc: 'Instrução extra abaixo do campo.' },
        { name: 'errorText',     type: 'string',   default: '—',      desc: 'Erro inline. Ativa aria-invalid + borda danger.' },
        { name: 'success',       type: 'boolean',  default: 'false',  desc: 'Borda sage para validação positiva.' },
        { name: 'disabled',      type: 'boolean',  default: 'false',  desc: 'Campo inativo.' },
        { name: 'required',      type: 'boolean',  default: 'false',  desc: 'Marca obrigatório (aria-required + asterisco).' },
        { name: 'showCharCount', type: 'boolean',  default: 'false',  desc: 'Contador role="status" (requer maxLength).' },
        { name: 'iconLeft',      type: 'boolean',  default: 'false',  desc: 'Slot esquerdo.' },
        { name: 'iconRight',     type: 'boolean',  default: 'false',  desc: 'Slot direito.' },
      ],
    },
    controls: {
      label:         { type: 'text',   value: 'Buscar paciente' },
      placeholder:   { type: 'text',   value: 'Nome, tutor ou microchip…' },
      helperText:    { type: 'text',   value: '' },
      errorText:     { type: 'text',   value: '' },
      success:       { type: 'toggle', value: false },
      disabled:      { type: 'toggle', value: false },
      required:      { type: 'toggle', value: false },
      showCharCount: { type: 'toggle', value: false },
      iconLeft:      { type: 'toggle', value: true },
      iconRight:     { type: 'toggle', value: false },
      maxLength:     { type: 'select', options: ['40','80','120','200','500'], value: '80' },
    },
    stories: [
      {
        name: 'Variantes', id: 'variants',
        render: (args) => (
          <div className="story-section">
            <div className="story-section-label">Estados</div>
            <div className="story-col" style={{ maxWidth: 420 }}>
              <KCTextField {...args} label="Padrão" placeholder="Digite o nome do paciente…" helperText="Busca por nome, espécie ou tutor"/>
              <KCTextField {...args} label="Sucesso · CRMV validado" placeholder="CRMV-SP 12.458" success={true} helperText="Veterinário encontrado ✓"/>
              <KCTextField {...args} label="Erro de validação" placeholder="CRMV ou email" errorText="CRMV não encontrado na base CFMV"/>
              <KCTextField {...args} label="Sem permissão de edição" placeholder="Bloqueado" disabled={true} helperText="Somente leitura para esta função"/>
            </div>
          </div>
        ),
      },
      {
        name: 'Com ícones', id: 'icons',
        render: (args) => (
          <div className="story-section">
            <div className="story-section-label">Slots de ícone</div>
            <div className="story-col" style={{ maxWidth: 420 }}>
              <KCTextField {...args} label="Busca global" placeholder="Paciente, tutor, prontuário…" iconLeft={true}/>
              <KCTextField {...args} label="Email da equipe" placeholder="veterinario@clinica.vet.br" iconLeft={true}/>
              <KCTextField {...args} label="Senha de acesso" placeholder="••••••••••••" iconRight={true}/>
              <KCTextField {...args} label="Anamnese (com contagem)" placeholder="Descreva a queixa principal…" showCharCount={true} maxLength={200}/>
            </div>
          </div>
        ),
      },
      {
        name: 'Formulário SOAP', id: 'soap',
        render: (args) => (
          <div className="story-section">
            <div className="story-section-label">Caso de uso · Consulta SOAP</div>
            <div className="kc-soap-demo">
              {[
                { letter: 'S', label: 'Subjetivo · queixa do tutor', placeholder: 'Relato: Luna coçando desde ontem, sem febre…', rows: 2 },
                { letter: 'O', label: 'Objetivo · exame físico', placeholder: 'Mucosas normocoradas, TPC <2s, auscultação normal…', rows: 2 },
                { letter: 'A', label: 'Avaliação · diagnóstico', placeholder: 'Atopia canina, suspeita de alergia alimentar…', required: true },
                { letter: 'P', label: 'Plano · conduta', placeholder: 'Apoquel 16mg 1x/dia · retorno 30d…', required: true },
              ].map(s => (
                <div key={s.letter} className="kc-soap-row">
                  <span className="kc-soap-letter">{s.letter}</span>
                  <div style={{ flex: 1 }}>
                    <KCTextField {...args} label={s.label} placeholder={s.placeholder} required={s.required}/>
                  </div>
                </div>
              ))}
            </div>
          </div>
        ),
      },
      {
        name: 'Formulário login', id: 'login',
        render: (args) => (
          <div className="story-section">
            <div className="story-section-label">Caso de uso · Login equipe clínica</div>
            <div className="story-col" style={{ maxWidth: 360 }}>
              <KCTextField {...args} label="CRMV ou email" placeholder="ana@petlife.vet.br" iconLeft={true} required={true}/>
              <KCTextField {...args} label="Senha" placeholder="••••••••••••" iconRight={true} required={true} helperText="Mínimo 8 caracteres"/>
            </div>
          </div>
        ),
      },
      {
        name: 'Playground', id: 'playground',
        render: (args) => (
          <div className="story-section">
            <div className="story-section-label">Playground · controles abaixo</div>
            <div className="preview-area">
              <div style={{ width: '100%', maxWidth: 420 }}>
                <KCTextField {...args}/>
              </div>
            </div>
          </div>
        ),
      },
    ],
  },
};

/* ─── Storybook Shell ────────────────────────────────────────── */
function App() {
  const [theme, setTheme] = React.useState('light');
  const [activeComp, setActiveComp] = React.useState('Button');
  const [activeStory, setActiveStory] = React.useState('variants');
  const [activeAddon, setActiveAddon] = React.useState('controls');
  const [controls, setControls] = React.useState(() =>
    Object.fromEntries(
      Object.entries(STORIES).map(([k, v]) => [k, Object.fromEntries(
        Object.entries(v.controls).map(([ck, cv]) => [ck, cv.value])
      )])
    )
  );

  React.useEffect(() => {
    document.body.setAttribute('data-theme', theme);
  }, [theme]);

  const comp = STORIES[activeComp];
  const story = comp.stories.find(s => s.id === activeStory) || comp.stories[0];
  const args = controls[activeComp];
  const ctrl = comp.controls;

  function setCtrl(key, val) {
    setControls(prev => ({
      ...prev,
      [activeComp]: { ...prev[activeComp], [key]: val }
    }));
  }

  function switchComp(name) {
    setActiveComp(name);
    setActiveStory(STORIES[name].stories[0].id);
  }

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100vh' }}>
      {/* Topbar */}
      <div className="sb-topbar">
        <a className="sb-logo" href="#">
          <KuraLogo size={22}/>
          Kura<em>.</em>
          <span className="badge">Clínica</span>
        </a>
        <nav className="sb-nav-tabs">
          {['Canvas','Docs'].map(t => (
            <button key={t} className={`sb-nav-tab ${activeAddon === t.toLowerCase() ? 'active' : ''}`}
              onClick={() => setActiveAddon(t.toLowerCase())}>{t}
            </button>
          ))}
        </nav>
        <div className="sb-theme-toggle">
          <span>Tema</span>
          <button className={theme === 'light' ? 'active' : ''} onClick={() => setTheme('light')} title="Light">
            <Icon d={IC.sun} size={14}/>
          </button>
          <button className={theme === 'dark' ? 'active' : ''} onClick={() => setTheme('dark')} title="Dark">
            <Icon d={IC.moon} size={14}/>
          </button>
        </div>
      </div>

      {/* Body */}
      <div className="sb-body">
        {/* Sidebar */}
        <aside className="sb-sidebar">
          {Object.entries(
            Object.entries(STORIES).reduce((acc, [name, s]) => {
              const g = s.group || 'Other';
              (acc[g] = acc[g] || []).push({ name, ...s });
              return acc;
            }, {})
          ).map(([group, items]) => (
            <div key={group}>
              <div className="sb-group-label">{group}</div>
              {items.map(item => (
                <div key={item.name}>
                  <button
                    className={`sb-story-btn ${activeComp === item.name ? 'active' : ''}`}
                    style={{ fontWeight: 500, marginBottom: 2 }}
                    onClick={() => switchComp(item.name)}
                  >
                    <Icon d={IC.grid} size={13}/>
                    {item.name}
                  </button>
                  {activeComp === item.name && item.stories.map(s => (
                    <button key={s.id}
                      className={`sb-story-btn ${activeStory === s.id ? 'active' : ''}`}
                      style={{ paddingLeft: 28, fontSize: 12 }}
                      onClick={() => setActiveStory(s.id)}>
                      <span className="dot"/>
                      {s.name}
                    </button>
                  ))}
                </div>
              ))}
            </div>
          ))}
        </aside>

        {/* Main */}
        <div className="sb-main">
          <div className="sb-canvas-bar">
            <span>{activeComp}</span>
            <span style={{ opacity: 0.4 }}>›</span>
            <b>{story.name}</b>
            <span className="tag">clinic · ocean</span>
            <span style={{ marginLeft: 'auto' }}>ocean · #1A3A52</span>
          </div>

          <div className="sb-canvas">
            <div className="sb-canvas-inner">
              {activeAddon === 'docs' ? (
                <div className="sb-docs">
                  <div className="kicker">— Kura Design System · Sistema Clínica</div>
                  <h2>{comp.autodoc.title} <em>· contexto clinic</em></h2>
                  <p>{comp.autodoc.when}</p>

                  {/* Diff callout */}
                  <div style={{
                    padding: '14px 16px', background: 'var(--ocean-pale)',
                    border: '1px solid rgba(26,58,82,0.18)', borderRadius: 10,
                    fontSize: 12.5, color: 'var(--ocean)', lineHeight: 1.6, marginBottom: 16,
                    display: 'flex', gap: 10,
                  }}>
                    <Icon d={IC.alert} size={14}/>
                    <div>
                      <strong>Contexto clinic vs tutor:</strong> a prop <code>context="clinic"</code> troca a cor primária de <code>--sage</code> (verde) para <code>--ocean</code> (azul-marinho) — refletindo a identidade do sistema clínico. O ring de foco também muda de <code>rgba(74,105,68)</code> para <code>rgba(45,94,126)</code>. Todos os outros tokens permanecem idênticos.
                    </div>
                  </div>

                  <table>
                    <thead>
                      <tr><th>Prop</th><th>Tipo</th><th>Default</th><th>Descrição</th></tr>
                    </thead>
                    <tbody>
                      {comp.autodoc.props.map(p => (
                        <tr key={p.name}>
                          <td><code>{p.name}</code>{p.required && <span className="prop-required"> *</span>}</td>
                          <td><code style={{ color: 'var(--info)' }}>{p.type}</code></td>
                          <td><code>{p.default}</code></td>
                          <td>{p.desc}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>

                  <div style={{ marginTop: 28 }}>
                    <div className="kicker" style={{ marginBottom: 16 }}>— Todas as histórias</div>
                    {comp.stories.map(s => (
                      <div key={s.id} style={{ marginBottom: 24 }}>
                        <div style={{ fontFamily: 'var(--font-mono)', fontSize: 11, color: 'var(--text-mute)', letterSpacing: '0.14em', textTransform: 'uppercase', marginBottom: 12 }}>{s.name}</div>
                        {s.render(args)}
                      </div>
                    ))}
                  </div>
                </div>
              ) : (
                story.render(args)
              )}
            </div>
          </div>

          {/* Addons */}
          <div className="sb-addons">
            <div className="sb-addons-tabs">
              {['Controls','Actions'].map(t => (
                <button key={t} className={`sb-addon-tab ${activeAddon === t.toLowerCase() ? 'active' : ''}`}
                  onClick={() => setActiveAddon(t.toLowerCase())}>{t}</button>
              ))}
            </div>
            <div className="sb-addons-body">
              {activeAddon === 'controls' ? (
                <table className="sb-controls-table">
                  <thead>
                    <tr>
                      <th style={{ width: 160 }}>Prop</th>
                      <th style={{ width: 100 }}>Tipo</th>
                      <th>Descrição</th>
                      <th style={{ width: 200 }}>Valor</th>
                    </tr>
                  </thead>
                  <tbody>
                    {Object.entries(ctrl).map(([key, cfg]) => (
                      <tr key={key}>
                        <td><span className="ctrl-name">{key}</span></td>
                        <td><span className="ctrl-type">{cfg.type}</span></td>
                        <td><span className="ctrl-desc">{comp.autodoc.props.find(p => p.name === key)?.desc || '—'}</span></td>
                        <td>
                          {cfg.type === 'select' && (
                            <select className="ctrl-select" value={args[key]}
                              onChange={e => setCtrl(key, e.target.value)}>
                              {cfg.options.map(o => <option key={o} value={o}>{o}</option>)}
                            </select>
                          )}
                          {cfg.type === 'toggle' && (
                            <button className={`ctrl-toggle ${args[key] ? 'on' : 'off'}`}
                              onClick={() => setCtrl(key, !args[key])}
                              aria-pressed={args[key]}
                              aria-label={`Toggle ${key}`}/>
                          )}
                          {cfg.type === 'text' && (
                            <input className="ctrl-text" value={args[key]}
                              onChange={e => setCtrl(key, e.target.value)}/>
                          )}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              ) : (
                <div style={{ fontSize: 13, color: 'var(--text-mute)', padding: '12px 0', fontStyle: 'italic' }}>
                  Nenhuma action registrada para este story.
                </div>
              )}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
