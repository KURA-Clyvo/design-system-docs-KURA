<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Kura · Storybook — App Tutor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Lexend:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kura-tokens.css"/>
<style>
/* ─── Shell ─────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
}

/* ─── Top bar ────────────────────────────────────────────────── */
.sb-topbar {
  height: 52px; flex-shrink: 0;
  background: var(--bg-elev);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 0;
  padding: 0 16px;
}
.sb-logo {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--font-display); font-size: 20px; font-weight: 500;
  color: var(--text); text-decoration: none; flex-shrink: 0;
  padding-right: 16px;
  border-right: 1px solid var(--border);
}
.sb-logo em { font-style: italic; color: var(--sage); }
.sb-logo .badge {
  font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--text-mute);
  background: var(--surface-2); padding: 3px 8px; border-radius: 999px;
}
.sb-nav-tabs {
  display: flex; gap: 0; margin-left: 0; flex: 1; padding: 0 8px;
}
.sb-nav-tab {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--text-mute);
  padding: 0 14px; height: 52px; background: transparent; border: 0;
  border-bottom: 2px solid transparent;
  cursor: pointer; display: flex; align-items: center; gap: 6px;
  transition: color var(--d-fast), border-color var(--d-fast);
}
.sb-nav-tab:hover { color: var(--text); }
.sb-nav-tab.active { color: var(--sage); border-bottom-color: var(--sage); }
.sb-theme-toggle {
  margin-left: auto; display: flex; align-items: center; gap: 8px;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--text-mute);
}
.sb-theme-toggle button {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border-radius: 8px;
  background: var(--surface-2); border: 1px solid var(--border); cursor: pointer;
  color: var(--text-mute); transition: all var(--d-fast);
}
.sb-theme-toggle button:hover { color: var(--text); background: var(--bg-elev); }
.sb-theme-toggle button.active { background: var(--sage); color: var(--text-on-sage); border-color: var(--sage); }

/* ─── Body ───────────────────────────────────────────────────── */
.sb-body {
  flex: 1; display: flex; overflow: hidden;
}

/* ─── Sidebar ────────────────────────────────────────────────── */
.sb-sidebar {
  width: 240px; flex-shrink: 0;
  background: var(--bg-elev); border-right: 1px solid var(--border);
  overflow-y: auto; padding: 16px 12px;
}
.sb-sidebar::-webkit-scrollbar { width: 4px; }
.sb-sidebar::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; }
.sb-group-label {
  font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--text-mute);
  padding: 8px 10px 4px; margin-top: 8px;
}
.sb-story-btn {
  width: 100%; text-align: left;
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; border-radius: 8px; border: 0;
  background: transparent; cursor: pointer; color: var(--text-soft);
  font-family: var(--font-body); font-size: 13px;
  transition: background var(--d-fast);
}
.sb-story-btn:hover { background: var(--surface-2); }
.sb-story-btn.active { background: var(--sage-pale); color: var(--sage); font-weight: 500; }
.sb-story-btn .dot {
  width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
  background: var(--border-strong);
}
.sb-story-btn.active .dot { background: var(--sage); }

/* ─── Main canvas ────────────────────────────────────────────── */
.sb-main {
  flex: 1; display: flex; flex-direction: column; overflow: hidden;
}
.sb-canvas-bar {
  height: 48px; flex-shrink: 0;
  background: var(--bg-elev); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px; padding: 0 20px;
  font-family: var(--font-mono); font-size: 11px; color: var(--text-mute);
  letter-spacing: 0.12em;
}
.sb-canvas-bar b { color: var(--text); font-weight: 600; }
.sb-canvas-bar .tag {
  background: var(--sage-pale); color: var(--sage);
  font-size: 9.5px; padding: 2px 8px; border-radius: 999px; letter-spacing: 0.14em;
  text-transform: uppercase;
}
.sb-canvas {
  flex: 1; overflow: auto; background: var(--surface-2);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 40px 40px 80px;
}
.sb-canvas-inner {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 16px;
  box-shadow: var(--shadow-md);
  width: 100%; max-width: 860px;
  padding: 48px;
}

/* ─── Addons panel ───────────────────────────────────────────── */
.sb-addons {
  height: 300px; flex-shrink: 0;
  border-top: 1px solid var(--border);
  background: var(--bg-elev);
  display: flex; flex-direction: column; overflow: hidden;
}
.sb-addons-tabs {
  display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.sb-addon-tab {
  font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--text-mute);
  padding: 0 18px; height: 40px; background: transparent; border: 0;
  border-bottom: 2px solid transparent; cursor: pointer;
  transition: color var(--d-fast), border-color var(--d-fast);
}
.sb-addon-tab.active { color: var(--sage); border-bottom-color: var(--sage); }
.sb-addons-body { flex: 1; overflow-y: auto; padding: 16px 20px; }

/* ─── Controls table ─────────────────────────────────────────── */
.sb-controls-table {
  width: 100%; border-collapse: collapse; font-size: 13px;
}
.sb-controls-table th {
  text-align: left; font-family: var(--font-mono); font-size: 9.5px;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-mute);
  padding: 6px 10px 10px; border-bottom: 1px solid var(--border);
}
.sb-controls-table td {
  padding: 8px 10px; border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
.sb-controls-table tr:last-child td { border-bottom: 0; }
.ctrl-name {
  font-family: var(--font-mono); font-size: 12px; color: var(--text);
  font-weight: 500;
}
.ctrl-type {
  font-family: var(--font-mono); font-size: 10.5px; color: var(--info); font-weight: 400;
}
.ctrl-desc { font-size: 12px; color: var(--text-mute); }
.ctrl-select {
  font-family: var(--font-body); font-size: 12.5px; padding: 5px 10px;
  background: var(--bg); border: 1px solid var(--border-strong);
  border-radius: 6px; color: var(--text); outline: none; cursor: pointer;
  min-width: 120px;
}
.ctrl-select:focus { border-color: var(--sage); }
.ctrl-toggle {
  width: 36px; height: 20px; border-radius: 999px; border: 0;
  cursor: pointer; position: relative; transition: background var(--d-fast);
}
.ctrl-toggle.on  { background: var(--sage); }
.ctrl-toggle.off { background: var(--border-strong); }
.ctrl-toggle::after {
  content: ''; position: absolute; top: 3px; width: 14px; height: 14px;
  border-radius: 50%; background: #fff; transition: left var(--d-fast);
}
.ctrl-toggle.on::after  { left: 19px; }
.ctrl-toggle.off::after { left: 3px; }
.ctrl-text {
  font-family: var(--font-body); font-size: 12.5px; padding: 5px 10px;
  background: var(--bg); border: 1px solid var(--border-strong);
  border-radius: 6px; color: var(--text); outline: none; min-width: 180px;
}
.ctrl-text:focus { border-color: var(--sage); }

/* ─── Docs ───────────────────────────────────────────────────── */
.sb-docs { padding: 4px 0; }
.sb-docs h2 {
  font-family: var(--font-display); font-weight: 500; font-size: 28px;
  letter-spacing: -0.02em; color: var(--text); margin: 0 0 8px;
}
.sb-docs h2 em { font-style: italic; color: var(--sage); font-weight: 400; }
.sb-docs .kicker {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--text-mute); margin-bottom: 6px;
}
.sb-docs p { font-size: 13px; line-height: 1.65; color: var(--text-soft); margin: 8px 0; }
.sb-docs code {
  font-family: var(--font-mono); font-size: 11.5px;
  background: var(--surface-2); padding: 2px 6px; border-radius: 4px;
  color: var(--info);
}
.sb-docs table {
  width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 16px;
}
.sb-docs table th {
  text-align: left; font-family: var(--font-mono); font-size: 9.5px;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-mute);
  padding: 6px 10px; border-bottom: 1px solid var(--border);
}
.sb-docs table td {
  padding: 9px 10px; border-bottom: 1px solid var(--border);
  color: var(--text-soft); vertical-align: top;
}
.sb-docs table code { font-size: 11px; }
.sb-docs .prop-required {
  color: var(--danger); font-size: 10px; font-family: var(--font-mono); font-weight: 600;
}

/* ─── Story section ──────────────────────────────────────────── */
.story-section { margin-bottom: 44px; }
.story-section-label {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--text-mute);
  margin-bottom: 20px; display: flex; align-items: center; gap: 10px;
}
.story-section-label::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}
.story-row {
  display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 8px;
}
.story-col { display: flex; flex-direction: column; gap: 10px; }

/* ─── Component styles (Tutor context) ───────────────────────── */
.k-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-family: var(--font-body); font-size: 14px; font-weight: 500;
  letter-spacing: 0.01em; padding: 12px 22px; min-height: 44px;
  border-radius: 999px; border: 1px solid transparent; cursor: pointer;
  text-decoration: none; transition: all var(--d-base) var(--ease);
  white-space: nowrap; position: relative;
}
.k-btn:focus-visible {
  outline: none; box-shadow: 0 0 0 3px rgba(74,105,68,0.35);
}
.k-btn.sz-sm { font-size: 12px; padding: 8px 14px; min-height: 32px; }
.k-btn.sz-lg { font-size: 16px; padding: 14px 28px; min-height: 52px; }
.k-btn-primary { background: var(--sage); color: var(--text-on-sage); box-shadow: var(--shadow-sage); }
.k-btn-primary:hover:not(:disabled) { background: var(--sage-light); }
.k-btn-secondary { background: transparent; color: var(--text); border-color: var(--border-strong); }
.k-btn-secondary:hover:not(:disabled) { background: var(--surface-2); }
.k-btn-ghost { background: var(--surface); color: var(--text); border-color: var(--border); }
.k-btn-ghost:hover:not(:disabled) { background: var(--surface-2); border-color: var(--border-strong); }
.k-btn-danger { background: var(--danger); color: #fff; }
.k-btn-danger:hover:not(:disabled) { opacity: 0.88; }
.k-btn:disabled { opacity: 0.45; cursor: not-allowed; }

/* Loading spinner */
@keyframes kspin { to { transform: rotate(360deg); } }
.k-spinner {
  width: 15px; height: 15px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.30);
  border-top-color: currentColor; animation: kspin 0.7s linear infinite;
  flex-shrink: 0;
}

/* TextField */
.k-tf-wrap { display: flex; flex-direction: column; gap: 0; }
.k-tf-label {
  font-family: var(--font-mono); font-size: 10px; font-weight: 500;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-mute);
  margin-bottom: 6px; display: flex; align-items: center; gap: 4px;
}
.k-tf-label .req { color: var(--danger); }
.k-tf-input-wrap { position: relative; display: flex; align-items: center; }
.k-tf-input {
  font-family: var(--font-body); font-size: 14.5px; width: 100%;
  padding: 12px 16px; background: var(--surface);
  border: 1px solid var(--border-strong); border-radius: 12px;
  color: var(--text); outline: none;
  transition: border-color var(--d-fast), box-shadow var(--d-fast);
}
.k-tf-input:focus {
  border-color: var(--sage);
  box-shadow: 0 0 0 3px rgba(74,105,68,0.15);
}
.k-tf-input::placeholder { color: var(--text-mute); }
.k-tf-input.has-icon-l { padding-left: 40px; }
.k-tf-input.has-icon-r { padding-right: 40px; }
.k-tf-input.state-error { border-color: var(--danger); }
.k-tf-input.state-error:focus { box-shadow: 0 0 0 3px rgba(177,74,47,0.15); }
.k-tf-input.state-success { border-color: var(--success); }
.k-tf-input.state-success:focus { box-shadow: 0 0 0 3px rgba(74,105,68,0.15); }
.k-tf-input:disabled { opacity: 0.45; cursor: not-allowed; background: var(--surface-2); }
.k-tf-icon-l, .k-tf-icon-r {
  position: absolute; top: 50%; transform: translateY(-50%);
  color: var(--text-mute); pointer-events: none;
}
.k-tf-icon-l { left: 13px; }
.k-tf-icon-r { right: 13px; }
.k-tf-footer { display: flex; justify-content: space-between; margin-top: 5px; min-height: 16px; }
.k-tf-helper { font-size: 11.5px; color: var(--text-mute); }
.k-tf-error  { font-size: 11.5px; color: var(--danger); font-weight: 500; }
.k-tf-count  { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-mute); margin-left: auto; }

/* Live preview label */
.preview-label {
  font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--text-mute); margin-bottom: 4px;
}
.preview-area {
  padding: 24px; background: var(--surface-2); border-radius: 12px;
  border: 1px dashed var(--border-strong); margin-bottom: 24px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 14px; min-height: 80px;
}
</style>
</head>
<body data-theme="light">
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
/* ── Icons ── */
function Icon({ d, size = 16 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
         stroke="currentColor" strokeWidth={1.8} strokeLinecap="round" strokeLinejoin="round">
      <path d={d}/>
    </svg>
  );
}
const IC = {
  search:  'M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z',
  eye:     'M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8zm11 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',
  mail:    'M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zm0 0l8 9 8-9',
  lock:    'M19 11H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2zM7 11V7a5 5 0 0 1 10 0v4',
  arrow:   'M5 12h14M13 6l6 6-6 6',
  paw:     'M6 10c-1.1 0-2-1.3-2-3s.9-3 2-3 2 1.3 2 3-.9 3-2 3zm5-4c-1.1 0-2-1.3-2-3S9.9 0 11 0s2 1.3 2 3-.9 3-2 3zm5 4c-1.1 0-2-1.3-2-3s.9-3 2-3 2 1.3 2 3-.9 3-2 3zm-8 1c-3 0-5 3-5 6 0 2 2 3 5 3s5-1 5-3c0-3-2-6-5-6z',
  check:   'M5 12l5 5 9-11',
  alert:   'M12 4 2 20h20L12 4zM12 10v5M12 18v.5',
  sun:     'M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10z',
  moon:    'M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z',
  book:    'M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 4h16v16H4z',
  grid:    'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z',
};

/* ── KuraLogo ── */
function KuraLogo({ size = 24, color = 'var(--sage)' }) {
  return (
    <svg width={size} height={size} viewBox="0 0 48 48" fill="none">
      <path d="M24 40C24 40 8 30 8 18C8 12 12 8 16 8C19 8 21.5 10 24 13C26.5 10 29 8 32 8C36 8 40 12 40 18C40 30 24 40 24 40Z"
        stroke={color} strokeWidth="2.5" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
      <circle cx="20" cy="20" r="2.5" fill={color} opacity="0.85"/>
      <circle cx="28" cy="20" r="2.5" fill={color} opacity="0.85"/>
      <circle cx="24" cy="26" r="3" fill={color}/>
    </svg>
  );
}

/* ── Button component ── */
function KButton({ variant = 'primary', size = 'md', loading = false, disabled = false, label = 'Botão', iconLeft = false, iconRight = false }) {
  const szClass = size === 'sm' ? 'sz-sm' : size === 'lg' ? 'sz-lg' : '';
  return (
    <button
      className={`k-btn k-btn-${variant} ${szClass}`}
      disabled={disabled || loading}
      aria-disabled={disabled || loading}
      aria-busy={loading}
    >
      {loading ? (
        <>
          <span className="k-spinner" aria-hidden="true"/>
          <span style={{ opacity: 0.65 }}>{label}</span>
          <span className="sr-only">Carregando…</span>
        </>
      ) : (
        <>
          {iconLeft  && <Icon d={IC.paw} size={size === 'sm' ? 13 : 16}/>}
          {label}
          {iconRight && <Icon d={IC.arrow} size={size === 'sm' ? 13 : 16}/>}
        </>
      )}
    </button>
  );
}

/* ── TextField component ── */
function KTextField({ label = 'Label', placeholder = 'Digite aqui…', helperText = '', errorText = '', success = false, disabled = false, required = false, iconLeft = false, iconRight = false, showCharCount = false, maxLength = 80, value: initVal = '' }) {
  const [val, setVal] = React.useState(initVal);
  const hasError = Boolean(errorText);
  const id = React.useId();
  return (
    <div className="k-tf-wrap">
      <label htmlFor={id} className="k-tf-label">
        {label}
        {required && <span className="req" aria-hidden="true">*</span>}
      </label>
      <div className="k-tf-input-wrap">
        {iconLeft  && <span className="k-tf-icon-l" aria-hidden="true"><Icon d={IC.search} size={15}/></span>}
        <input
          id={id}
          className={`k-tf-input${iconLeft ? ' has-icon-l' : ''}${iconRight ? ' has-icon-r' : ''}${hasError ? ' state-error' : success ? ' state-success' : ''}`}
          placeholder={placeholder}
          disabled={disabled}
          required={required}
          aria-invalid={hasError}
          aria-required={required}
          maxLength={maxLength}
          value={val}
          onChange={e => setVal(e.target.value)}
        />
        {iconRight && <span className="k-tf-icon-r" aria-hidden="true"><Icon d={IC.eye} size={15}/></span>}
      </div>
      <div className="k-tf-footer">
        {hasError
          ? <span className="k-tf-error" role="alert">{errorText}</span>
          : helperText
            ? <span className="k-tf-helper">{helperText}</span>
            : <span/>
        }
        {showCharCount && <span role="status" className="k-tf-count">{val.length}/{maxLength}</span>}
      </div>
    </div>
  );
}

/* ─── Stories definition ─────────────────────────────────────── */
const STORIES = {
  Button: {
    group: 'Components',
    autodoc: {
      title: 'Button',
      when: 'Use o Button para toda ação primária ou de navegação no app Kura Tutor. A variante `primary` (sage verde) é para a ação mais importante da tela; `secondary` e `ghost` para ações secundárias; `danger` para ações destrutivas. Prefira o tamanho `md` (44px) para garantir área de toque mínima de 44×44 px em mobile.',
      props: [
        { name: 'variant',   type: "'primary'|'secondary'|'ghost'|'danger'", default: "'primary'",  desc: 'Estilo visual e intenção semântica.' },
        { name: 'size',      type: "'sm'|'md'|'lg'",                         default: "'md'",       desc: 'Preset de tamanho. sm=32px, md=44px, lg=52px.' },
        { name: 'loading',   type: 'boolean',                                 default: 'false',      desc: 'Exibe spinner e desabilita interação.' },
        { name: 'disabled',  type: 'boolean',                                 default: 'false',      desc: 'Estado desabilitado. Adiciona aria-disabled.' },
        { name: 'iconLeft',  type: 'boolean',                                 default: 'false',      desc: 'Ícone decorativo antes do label.' },
        { name: 'iconRight', type: 'boolean',                                 default: 'false',      desc: 'Ícone decorativo após o label.' },
        { name: 'label',     type: 'string',                                  default: "'Botão'",    desc: 'Texto do botão.' },
      ],
    },
    controls: {
      variant:   { type: 'select', options: ['primary','secondary','ghost','danger'], value: 'primary' },
      size:      { type: 'select', options: ['sm','md','lg'],                         value: 'md' },
      label:     { type: 'text',                                                       value: 'Confirmar consulta' },
      loading:   { type: 'toggle',                                                     value: false },
      disabled:  { type: 'toggle',                                                     value: false },
      iconLeft:  { type: 'toggle',                                                     value: false },
      iconRight: { type: 'toggle',                                                     value: false },
    },
    stories: [
      {
        name: 'Variantes', id: 'variants',
        render: (args) => (
          <div className="story-section">
            <div className="story-section-label">Variantes · {args.size}</div>
            <div className="story-row">
              {['primary','secondary','ghost','danger'].map(v => (
                <KButton key={v} {...args} variant={v} label={v.charAt(0).toUpperCase()+v.slice(1)}/>
              ))}
            </div>
          </div>
        ),
      },
      {
        name: 'Tamanhos', id: 'sizes',
        render: (args) => (
          <div className="story-section">
            <div className="story-section-label">Tamanhos</div>
            <div className="story-row" style={{ alignItems: 'flex-end' }}>
              {['sm','md','lg'].map(s => (
                <KButton key={s} {...args} size={s} label={`Size ${s.toUpperCase()}`}/>
              ))}
            </div>
          </div>
        ),
      },
      {
        name: 'Com ícones', id: 'icons',
        render: (args) => (
          <div className="story-section">
            <div className="story-section-label">Com ícones</div>
            <div className="story-row">
              <KButton {...args} iconLeft={true}  label="Meus pets"/>
              <KButton {...args} iconRight={true} label="Ver consulta"/>
              <KButton {...args} iconLeft={true} iconRight={true} label="Agendar"/>
              <KButton {...args} variant="ghost" iconLeft={true} label="Cancelar"/>
            </div>
          </div>
        ),
      },
      {
        name: 'Estados', id: 'states',
        render: (args) => (
          <div className="story-section">
            <div className="story-section-label">Estados</div>
            <div className="story-row">
              <KButton {...args} label="Normal"/>
              <KButton {...args} label="Loading" loading={true}/>
              <KButton {...args} label="Disabled" disabled={true}/>
              <KButton {...args} variant="danger" label="Excluir pet"/>
            </div>
          </div>
        ),
      },
      {
        name: 'Playground', id: 'playground',
        render: (args) => (
          <div className="story-section">
            <div className="story-section-label">Playground · controles abaixo</div>
            <div className="preview-area">
              <KButton {...args}/>
            </div>
          </div>
        ),
      },
    ],
  },

  TextField: {
    group: 'Components',
    autodoc: {
      title: 'TextField',
      when: 'Use o TextField para toda entrada de texto no app Kura Tutor: login, cadastro de pets, busca, notas. Sempre forneça um `label` legível — nunca use apenas `placeholder` como substituto de label (inacessível). Use `helperText` para orientações e `errorText` para feedback de validação. O slot `leadingSlot` é ideal para ícones contextuais (busca, email, cadeado).',
      props: [
        { name: 'label',         type: 'string',   default: '—',       desc: 'Label visível e acessível. Sempre obrigatório.',      required: true },
        { name: 'placeholder',   type: 'string',   default: '—',       desc: 'Dica no campo vazio. Não substitui o label.' },
        { name: 'helperText',    type: 'string',   default: '—',       desc: 'Texto auxiliar abaixo do campo.' },
        { name: 'errorText',     type: 'string',   default: '—',       desc: 'Mensagem de erro. Ativa estado de erro + aria-invalid.' },
        { name: 'success',       type: 'boolean',  default: 'false',   desc: 'Borda verde para validação positiva.' },
        { name: 'disabled',      type: 'boolean',  default: 'false',   desc: 'Campo desabilitado.' },
        { name: 'required',      type: 'boolean',  default: 'false',   desc: 'Marca o campo como obrigatório.' },
        { name: 'showCharCount', type: 'boolean',  default: 'false',   desc: 'Contador de caracteres (requer maxLength).' },
        { name: 'iconLeft',      type: 'boolean',  default: 'false',   desc: 'Ícone no slot esquerdo.' },
        { name: 'iconRight',     type: 'boolean',  default: 'false',   desc: 'Ícone no slot direito.' },
        { name: 'maxLength',     type: 'number',   default: '80',      desc: 'Limite de caracteres.' },
      ],
    },
    controls: {
      label:         { type: 'text',   value: 'Nome do pet' },
      placeholder:   { type: 'text',   value: 'Ex.: Luna, Thor, Mel…' },
      helperText:    { type: 'text',   value: 'Como seu pet prefere ser chamado' },
      errorText:     { type: 'text',   value: '' },
      success:       { type: 'toggle', value: false },
      disabled:      { type: 'toggle', value: false },
      required:      { type: 'toggle', value: false },
      showCharCount: { type: 'toggle', value: false },
      iconLeft:      { type: 'toggle', value: false },
      iconRight:     { type: 'toggle', value: false },
      maxLength:     { type: 'select', options: ['20','40','80','120','200'], value: '80' },
    },
    stories: [
      {
        name: 'Variantes', id: 'variants',
        render: (args) => (
          <div className="story-section">
            <div className="story-section-label">Estados</div>
            <div className="story-col" style={{ maxWidth: 380 }}>
              <KTextField {...args} label="Estado padrão" placeholder="Digite aqui…" helperText="Texto auxiliar opcional"/>
              <KTextField {...args} label="Com validação" placeholder="luna@email.com" success={true} helperText="Email disponível ✓"/>
              <KTextField {...args} label="Com erro" placeholder="Confirmar email" errorText="Emails não correspondem"/>
              <KTextField {...args} label="Desabilitado" placeholder="Não editável" disabled={true} helperText="Campo somente leitura"/>
            </div>
          </div>
        ),
      },
      {
        name: 'Com ícones', id: 'icons',
        render: (args) => (
          <div className="story-section">
            <div className="story-section-label">Slots de ícone</div>
            <div className="story-col" style={{ maxWidth: 380 }}>
              <KTextField {...args} label="Busca" placeholder="Buscar pets, consultas…" iconLeft={true}/>
              <KTextField {...args} label="Email" placeholder="veterinario@email.com" iconLeft={true}/>
              <KTextField {...args} label="Senha" placeholder="••••••••••••" iconRight={true}/>
              <KTextField {...args} label="Pesquisa com contagem" placeholder="Descreva os sintomas…" iconLeft={true} showCharCount={true} maxLength={80}/>
            </div>
          </div>
        ),
      },
      {
        name: 'Obrigatório', id: 'required',
        render: (args) => (
          <div className="story-section">
            <div className="story-section-label">Campos obrigatórios · formulário cadastro pet</div>
            <div className="story-col" style={{ maxWidth: 380 }}>
              <KTextField {...args} label="Nome do pet" placeholder="Luna" required={true}/>
              <KTextField {...args} label="Espécie" placeholder="Cão / Gato / Ave…" required={true}/>
              <KTextField {...args} label="Data de nascimento" placeholder="15/03/2020" required={true} helperText="Formato DD/MM/AAAA"/>
              <KTextField {...args} label="Observações" placeholder="Alergias, cuidados especiais…" helperText="Opcional" showCharCount={true} maxLength={120}/>
            </div>
          </div>
        ),
      },
      {
        name: 'Playground', id: 'playground',
        render: (args) => (
          <div className="story-section">
            <div className="story-section-label">Playground · controles abaixo</div>
            <div className="preview-area">
              <div style={{ width: '100%', maxWidth: 380 }}>
                <KTextField {...args}/>
              </div>
            </div>
          </div>
        ),
      },
    ],
  },
};

/* ─── Storybook Shell ────────────────────────────────────────── */
function App() {
  const [theme, setTheme] = React.useState('light');
  const [activeComp, setActiveComp] = React.useState('Button');
  const [activeStory, setActiveStory] = React.useState('variants');
  const [activeAddon, setActiveAddon] = React.useState('controls');
  const [controls, setControls] = React.useState(() =>
    Object.fromEntries(
      Object.entries(STORIES).map(([k, v]) => [k, Object.fromEntries(
        Object.entries(v.controls).map(([ck, cv]) => [ck, cv.value])
      )])
    )
  );

  React.useEffect(() => {
    document.body.setAttribute('data-theme', theme);
  }, [theme]);

  const comp = STORIES[activeComp];
  const story = comp.stories.find(s => s.id === activeStory) || comp.stories[0];
  const args = controls[activeComp];
  const ctrl = comp.controls;

  function setCtrl(key, val) {
    setControls(prev => ({
      ...prev,
      [activeComp]: { ...prev[activeComp], [key]: val }
    }));
  }

  function switchComp(name) {
    setActiveComp(name);
    setActiveStory(STORIES[name].stories[0].id);
  }

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100vh' }}>
      {/* Top bar */}
      <div className="sb-topbar">
        <a className="sb-logo" href="#">
          <KuraLogo size={22}/>
          Kura<em>.</em>
          <span className="badge">Tutor</span>
        </a>
        <nav className="sb-nav-tabs">
          {['Canvas', 'Docs'].map(t => (
            <button key={t} className={`sb-nav-tab ${activeAddon === t.toLowerCase() ? 'active' : ''}`}
              onClick={() => setActiveAddon(t.toLowerCase())}>
              {t}
            </button>
          ))}
        </nav>
        <div className="sb-theme-toggle">
          <span>Tema</span>
          <button className={theme === 'light' ? 'active' : ''} onClick={() => setTheme('light')}
            title="Light" aria-label="Light mode">
            <Icon d={IC.sun} size={14}/>
          </button>
          <button className={theme === 'dark' ? 'active' : ''} onClick={() => setTheme('dark')}
            title="Dark" aria-label="Dark mode">
            <Icon d={IC.moon} size={14}/>
          </button>
        </div>
      </div>

      {/* Body */}
      <div className="sb-body">
        {/* Sidebar */}
        <aside className="sb-sidebar">
          {Object.entries(
            Object.entries(STORIES).reduce((acc, [name, s]) => {
              const g = s.group || 'Other';
              (acc[g] = acc[g] || []).push({ name, ...s });
              return acc;
            }, {})
          ).map(([group, items]) => (
            <div key={group}>
              <div className="sb-group-label">{group}</div>
              {items.map(item => (
                <div key={item.name}>
                  <button
                    className={`sb-story-btn ${activeComp === item.name && !activeStory ? 'active' : ''}`}
                    style={{ fontWeight: 500, marginBottom: 2 }}
                    onClick={() => switchComp(item.name)}
                  >
                    <Icon d={IC.grid} size={13}/>
                    {item.name}
                  </button>
                  {activeComp === item.name && item.stories.map(s => (
                    <button key={s.id}
                      className={`sb-story-btn ${activeStory === s.id ? 'active' : ''}`}
                      style={{ paddingLeft: 28, fontSize: 12 }}
                      onClick={() => setActiveStory(s.id)}>
                      <span className="dot"/>
                      {s.name}
                    </button>
                  ))}
                </div>
              ))}
            </div>
          ))}
        </aside>

        {/* Main */}
        <div className="sb-main">
          {/* Breadcrumb bar */}
          <div className="sb-canvas-bar">
            <span>{activeComp}</span>
            <span style={{ opacity: 0.4 }}>›</span>
            <b>{story.name}</b>
            <span className="tag">tutor</span>
            <span style={{ marginLeft: 'auto', display: 'flex', gap: 8 }}>
              <span>sage · #4A6944</span>
            </span>
          </div>

          {/* Canvas / Docs */}
          <div className="sb-canvas">
            <div className="sb-canvas-inner">
              {activeAddon === 'docs' ? (
                /* Autodocs */
                <div className="sb-docs">
                  <div className="kicker">— Kura Design System · App Tutor</div>
                  <h2>{comp.autodoc.title} <em>component</em></h2>
                  <p>{comp.autodoc.when}</p>
                  <table>
                    <thead>
                      <tr>
                        <th>Prop</th>
                        <th>Tipo</th>
                        <th>Default</th>
                        <th>Descrição</th>
                      </tr>
                    </thead>
                    <tbody>
                      {comp.autodoc.props.map(p => (
                        <tr key={p.name}>
                          <td><code>{p.name}</code>{p.required && <span className="prop-required"> *</span>}</td>
                          <td><code style={{ color: 'var(--info)' }}>{p.type}</code></td>
                          <td><code>{p.default}</code></td>
                          <td>{p.desc}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>

                  <div style={{ marginTop: 28 }}>
                    <div className="kicker" style={{ marginBottom: 16 }}>— Todas as histórias</div>
                    {comp.stories.map(s => (
                      <div key={s.id} style={{ marginBottom: 24 }}>
                        <div style={{ fontFamily: 'var(--font-mono)', fontSize: 11, color: 'var(--text-mute)', letterSpacing: '0.14em', textTransform: 'uppercase', marginBottom: 12 }}>{s.name}</div>
                        {s.render(args)}
                      </div>
                    ))}
                  </div>
                </div>
              ) : (
                story.render(args)
              )}
            </div>
          </div>

          {/* Addons panel */}
          <div className="sb-addons">
            <div className="sb-addons-tabs">
              {['Controls', 'Actions'].map(t => (
                <button key={t} className={`sb-addon-tab ${activeAddon === t.toLowerCase() ? 'active' : ''}`}
                  onClick={() => setActiveAddon(t.toLowerCase())}>{t}</button>
              ))}
            </div>
            <div className="sb-addons-body">
              {activeAddon === 'controls' ? (
                <table className="sb-controls-table">
                  <thead>
                    <tr>
                      <th style={{ width: 160 }}>Prop</th>
                      <th style={{ width: 100 }}>Tipo</th>
                      <th>Descrição</th>
                      <th style={{ width: 200 }}>Valor</th>
                    </tr>
                  </thead>
                  <tbody>
                    {Object.entries(ctrl).map(([key, cfg]) => (
                      <tr key={key}>
                        <td><span className="ctrl-name">{key}</span></td>
                        <td><span className="ctrl-type">{cfg.type}</span></td>
                        <td><span className="ctrl-desc">{comp.autodoc.props.find(p => p.name === key)?.desc || '—'}</span></td>
                        <td>
                          {cfg.type === 'select' && (
                            <select className="ctrl-select" value={args[key]}
                              onChange={e => setCtrl(key, e.target.value)}>
                              {cfg.options.map(o => <option key={o} value={o}>{o}</option>)}
                            </select>
                          )}
                          {cfg.type === 'toggle' && (
                            <button className={`ctrl-toggle ${args[key] ? 'on' : 'off'}`}
                              onClick={() => setCtrl(key, !args[key])}
                              aria-pressed={args[key]}
                              aria-label={`Toggle ${key}`}/>
                          )}
                          {cfg.type === 'text' && (
                            <input className="ctrl-text" value={args[key]}
                              onChange={e => setCtrl(key, e.target.value)}/>
                          )}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              ) : (
                <div style={{ fontSize: 13, color: 'var(--text-mute)', padding: '12px 0', fontStyle: 'italic' }}>
                  Nenhuma action registrada para este story.
                </div>
              )}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
